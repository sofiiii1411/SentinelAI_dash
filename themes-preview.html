<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SentinelAI-X | Professional Theme Selector</title>
  <meta name="description" content="Select and apply clean, professional executive themes for SentinelAI-X login portal." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Plus Jakarta Sans', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s ease;
    }

    /* =========================================================================
       TOP FLOATING DOCK: PROFESSIONAL THEME SELECTOR
       ========================================================================= */
    .top-theme-dock {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 12px 35px -6px rgba(15, 23, 42, 0.12);
      max-width: 95vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-theme-dock::-webkit-scrollbar { display: none; }

    .dock-title {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #0f172a;
      padding: 0 12px 0 6px;
      border-right: 1.5px solid #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .theme-select-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .theme-select-btn:hover {
      background: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .theme-select-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.25);
    }

    .theme-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .apply-to-login-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 7px 18px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.2s ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .apply-to-login-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    /* Ambient Background Layer */
    .theme-bg-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 1;
    }

    /* Floating Info Pill (Bottom Right) */
    .bottom-info-card {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 12px 18px;
      box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      pointer-events: none;
    }

    .bottom-info-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bottom-info-desc {
      font-size: 0.76rem;
      color: #64748b;
      line-height: 1.4;
    }

    /* Main Viewport Stage */
    .viewport-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px;
      padding: clamp(0.75rem, 2vh, 1.8rem) clamp(1rem, 2.5vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      margin-top: 25px;
    }

    /* Professional Executive Card Frame */
    .master-card-glow-frame {
      width: 100%;
      position: relative;
      border-radius: 24px;
      padding: 1px;
      background: #e2e8f0;
      box-shadow: 
        0 25px 50px -12px rgba(15, 23, 42, 0.08),
        0 0 0 1px rgba(226, 232, 240, 0.8);
      transition: all 0.3s ease;
    }

    /* Master Card Container */
    .master-card-container {
      width: 100%;
      background: #ffffff;
      border-radius: 23px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      align-items: center;
      overflow: hidden;
      position: relative;
      max-height: calc(100vh - clamp(1.5rem, 4vh, 3.6rem) - 50px);
      max-height: calc(100dvh - clamp(1.5rem, 4vh, 3.6rem) - 50px);
    }

    /* Left Brand Artwork */
    .left-brand-column {
      padding: clamp(0.5rem, 1.2vw, 1.2rem);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
      border-top-left-radius: 23px;
      border-bottom-left-radius: 23px;
      height: 100%;
      background: #f8fafc;
      border-right: 1px solid #f1f5f9;
    }

    .left-brand-image-artwork {
      width: 100%;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: 18px;
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.04);
    }

    /* Right Auth Column */
    .right-auth-column {
      padding: clamp(1.2rem, 3vh, 2.5rem) clamp(1rem, 2vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      height: 100%;
      background: #ffffff;
    }

    .elevated-auth-subcard {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      position: relative;
      padding: clamp(1.5rem, 3vh, 2.5rem) clamp(1.4rem, 2vw, 2.2rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .shield-icon-container {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
    }
    .shield-icon-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .eyebrow-secure-access {
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #2563eb;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .secure-access-multicolor-line {
      width: 44px;
      height: 3px;
      background: #2563eb;
      border-radius: 99px;
      margin: 0.2rem auto clamp(0.5rem, 1vh, 0.8rem) auto;
    }

    .heading-sign-in {
      font-family: var(--font-heading);
      font-size: clamp(1.75rem, 2.8vh, 2.2rem);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .sub-access-desc {
      font-size: clamp(0.82rem, 1.2vh, 0.9rem);
      color: #64748b;
      margin-bottom: clamp(1rem, 2vh, 1.5rem);
      text-align: center;
      font-weight: 500;
    }

    .dummy-field {
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .dummy-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #334155;
    }
    .dummy-input {
      width: 100%;
      height: 44px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      padding: 0 14px;
      display: flex;
      align-items: center;
      color: #64748b;
      font-size: 0.88rem;
    }

    .dummy-submit-btn {
      width: 100%;
      height: 46px;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    @media (max-width: 980px) {
      .master-card-container { grid-template-columns: 1fr; }
      .left-brand-column { display: none; }
      .top-theme-dock { top: 10px; padding: 4px 8px; }
    }
  </style>
</head>
<body>

  <!-- FLOATING TOP DOCK -->
  <nav class="top-theme-dock" aria-label="Professional Theme Selector">
    <div class="dock-title">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
      Executive Themes
    </div>

    <button class="theme-select-btn active" data-theme="slate-grid">
      <span class="theme-color-dot" style="color:#2563eb;"></span>
      1. Enterprise Slate & Micro-Grid
    </button>

    <button class="theme-select-btn" data-theme="executive-cobalt">
      <span class="theme-color-dot" style="color:#0284c7;"></span>
      2. Ambient Executive Cobalt
    </button>

    <button class="theme-select-btn" data-theme="lab-precision">
      <span class="theme-color-dot" style="color:#10b981;"></span>
      3. Laboratory Precision Matrix
    </button>

    <button class="theme-select-btn" data-theme="minimal-studio">
      <span class="theme-color-dot" style="color:#64748b;"></span>
      4. Minimal Studio Light
    </button>

    <button class="apply-to-login-btn" id="applyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      Apply Theme to Main Login
    </button>
  </nav>

  <!-- Dynamic Theme Background Layer -->
  <canvas id="themeCanvas" class="canvas-bg" aria-hidden="true"></canvas>

  <!-- Bottom Floating Info Card -->
  <div class="bottom-info-card">
    <div class="bottom-info-title" id="infoTitle">
      <span style="width:8px;height:8px;border-radius:50%;background:#2563eb;display:inline-block;"></span>
      Enterprise Slate & Micro-Grid
    </div>
    <div class="bottom-info-desc" id="infoDesc">
      Crisp architectural dot grid with a subtle executive blue ambient aura and refined corporate styling.
    </div>
  </div>

  <!-- Viewport Stage -->
  <div class="viewport-stage">
    <div class="master-card-glow-frame" id="cardFrame">
      <main class="master-card-container">
        
        <!-- Left Brand Column -->
        <section class="left-brand-column">
          <img 
            src="assets/sentinel-left-brand.png" 
            alt="SentinelAI-X Distributed Laboratory Security System" 
            class="left-brand-image-artwork"
            onerror="this.onerror=null; this.src='assets/lab-network.png';"
          />
        </section>

        <!-- Right Auth Column -->
        <section class="right-auth-column">
          <div class="elevated-auth-subcard">
            
            <div class="shield-icon-container">
              <img src="assets/shield-badge-clean.png" alt="SentinelAI-X Shield" onerror="this.onerror=null; this.src='assets/shield-badge-exact.png';" />
            </div>

            <p class="eyebrow-secure-access">S E C U R E &nbsp; A C C E S S</p>
            <div class="secure-access-multicolor-line"></div>

            <h2 class="heading-sign-in">Sign In</h2>
            <p class="sub-access-desc">Access your laboratory security dashboard</p>

            <div class="dummy-field">
              <span class="dummy-label">Email Address</span>
              <div class="dummy-input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;">
                  <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                  <path d="m22 7-10 6L2 7"></path>
                </svg>
                <span>sofianu723@gmail.com</span>
              </div>
            </div>

            <div class="dummy-field">
              <span class="dummy-label">Password</span>
              <div class="dummy-input">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;">
                  <rect x="3" y="11" width="18" height="11" rx="2.5"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>••••••••••••</span>
              </div>
            </div>

            <button class="dummy-submit-btn" type="button">
              <span>Sign In to SentinelAI-X</span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <polyline points="9 18 15 12 9 6"></polyline>
              </svg>
            </button>

          </div>
        </section>

      </main>
    </div>
  </div>

  <script>
    (function initThemeEngine() {
      const canvas = document.getElementById('themeCanvas');
      const ctx = canvas.getContext('2d');
      let width, height, dpr;
      let animationFrameId;
      let activeTheme = localStorage.getItem('sentinel_theme') || 'slate-grid';
      let tick = 0;

      const THEMES_INFO = {
        'slate-grid': {
          title: '1. Enterprise Slate & Micro-Grid (Recommended)',
          desc: 'Minimalist enterprise architectural grid with delicate connected telemetry nodes and refined soft ambient lighting.',
          bgColor: '#f8fafc'
        },
        'executive-cobalt': {
          title: '2. Ambient Executive Cobalt',
          desc: 'Deep royal blue & ice-pearl subtle diffuse aura. Clean, calm, and distraction-free.',
          bgColor: '#f0f6ff'
        },
        'lab-precision': {
          title: '3. Laboratory Precision Matrix',
          desc: 'Subtle technical sensor coordinates, grid ticks, and soft green/blue operational status nodes.',
          bgColor: '#f4fbf7'
        },
        'minimal-studio': {
          title: '4. Minimal Studio Light',
          desc: 'Ultra-pure crisp studio lighting with subtle ambient diffusion. Modern and pristine.',
          bgColor: '#fafafa'
        }
      };

      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        initNodes();
      }

      let nodes = [];
      function initNodes() {
        nodes = [];
        const count = 35;
        for (let i = 0; i < count; i++) {
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.3,
            vy: (Math.random() - 0.5) * 0.3,
            radius: Math.random() * 2 + 1.5,
            pulse: Math.random() * Math.PI * 2
          });
        }
      }

      function render() {
        tick++;
        ctx.clearRect(0, 0, width, height);

        if (activeTheme === 'slate-grid') {
          renderSlateGrid();
        } else if (activeTheme === 'executive-cobalt') {
          renderExecutiveCobalt();
        } else if (activeTheme === 'lab-precision') {
          renderLabPrecision();
        } else if (activeTheme === 'minimal-studio') {
          renderMinimalStudio();
        }

        animationFrameId = requestAnimationFrame(render);
      }

      // THEME 1: Enterprise Slate & Micro-Grid
      function renderSlateGrid() {
        // Draw Subtle Micro-dot Grid
        const spacing = 40;
        ctx.fillStyle = 'rgba(148, 163, 184, 0.35)';
        for (let x = 0; x < width; x += spacing) {
          for (let y = 0; y < height; y += spacing) {
            ctx.beginPath();
            ctx.arc(x, y, 1, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // Draw Soft Subtle Nodes with connecting hair-lines
        const maxDist = 130;
        for (let i = 0; i < nodes.length; i++) {
          const n1 = nodes[i];
          n1.x += n1.vx;
          n1.y += n1.vy;
          if (n1.x < 0 || n1.x > width) n1.vx *= -1;
          if (n1.y < 0 || n1.y > height) n1.vy *= -1;

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dx = n1.x - n2.x;
            const dy = n1.y - n2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDist) {
              const alpha = (1 - dist / maxDist) * 0.22;
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.strokeStyle = `rgba(37, 99, 235, ${alpha.toFixed(2)})`;
              ctx.lineWidth = 0.9;
              ctx.stroke();
            }
          }

          ctx.beginPath();
          ctx.fillStyle = 'rgba(37, 99, 235, 0.6)';
          ctx.arc(n1.x, n1.y, n1.radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // THEME 2: Executive Cobalt Ambient Glow
      function renderExecutiveCobalt() {
        const time = tick * 0.008;
        const cx = width * 0.5 + Math.sin(time) * 40;
        const cy = height * 0.5 + Math.cos(time) * 30;

        const grad1 = ctx.createRadialGradient(cx, cy, 50, cx, cy, Math.max(width, height) * 0.65);
        grad1.addColorStop(0, 'rgba(59, 130, 246, 0.12)');
        grad1.addColorStop(0.5, 'rgba(96, 165, 250, 0.04)');
        grad1.addColorStop(1, 'transparent');
        ctx.fillStyle = grad1;
        ctx.fillRect(0, 0, width, height);

        // Soft calm wave line
        ctx.beginPath();
        for (let x = 0; x <= width; x += 20) {
          const y = height * 0.75 + Math.sin(x * 0.002 + time) * 25;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = 'rgba(37, 99, 235, 0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      // THEME 3: Laboratory Precision Matrix
      function renderLabPrecision() {
        const spacing = 60;
        ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
        ctx.lineWidth = 1;

        for (let x = 0; x < width; x += spacing) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y < height; y += spacing) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // Technical Corner Marks & Crosshairs
        const crossPositions = [
          { x: 100, y: 120 }, { x: width - 120, y: 140 },
          { x: 140, y: height - 100 }, { x: width - 140, y: height - 120 }
        ];
        crossPositions.forEach((pos) => {
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.35)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(pos.x - 8, pos.y);
          ctx.lineTo(pos.x + 8, pos.y);
          ctx.moveTo(pos.x, pos.y - 8);
          ctx.lineTo(pos.x, pos.y + 8);
          ctx.stroke();
        });

        // Telemetry Label
        ctx.font = '500 11px JetBrains Mono, monospace';
        ctx.fillStyle = 'rgba(16, 185, 129, 0.6)';
        ctx.fillText('STATUS: ONLINE // ENCRYPTION: ACTIVE', 40, height - 35);
      }

      // THEME 4: Minimal Studio Light
      function renderMinimalStudio() {
        const grad = ctx.createRadialGradient(width * 0.5, height * 0.45, 100, width * 0.5, height * 0.5, width * 0.6);
        grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grad.addColorStop(0.6, 'rgba(241, 245, 249, 0.6)');
        grad.addColorStop(1, 'rgba(226, 232, 240, 0.4)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }

      // Switcher Buttons
      const themeBtns = document.querySelectorAll('.theme-select-btn');
      const infoTitle = document.getElementById('infoTitle');
      const infoDesc = document.getElementById('infoDesc');
      const applyBtn = document.getElementById('applyBtn');

      function setTheme(themeKey) {
        activeTheme = themeKey;
        localStorage.setItem('sentinel_theme', themeKey);
        
        themeBtns.forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-theme') === themeKey);
        });

        const info = THEMES_INFO[themeKey];
        if (info) {
          infoTitle.textContent = info.title;
          infoDesc.textContent = info.desc;
          document.body.style.backgroundColor = info.bgColor;
        }

        if (applyBtn) {
          applyBtn.onclick = () => {
            localStorage.setItem('sentinel_theme', themeKey);
            window.location.href = `login.html?theme=${themeKey}`;
          };
        }
      }

      themeBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          setTheme(btn.getAttribute('data-theme'));
        });
      });

      // Initialize
      setTheme(activeTheme);
      window.addEventListener('resize', resize);
      resize();
      render();
    })();
  </script>
</body>
