<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SentinelAI-X | Professional Theme Selector — Laboratory Security Portal</title>
  <meta name="description" content="Explore and choose from 8 professional, ultra-neat background themes for the SentinelAI-X login portal." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Plus Jakarta Sans', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      background-color: #f1f5fc;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* =========================================================================
       TOP THEME SELECTOR DOCK (CLEAN & PROFESSIONAL)
       ========================================================================= */
    .theme-header-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: 
        0 12px 30px -6px rgba(0, 0, 0, 0.10),
        0 0 0 1px rgba(226, 232, 240, 0.95);
      max-width: 96vw;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .theme-header-bar::-webkit-scrollbar { display: none; }

    .theme-dock-brand {
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #0f172a;
      padding: 0 10px 0 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-right: 1.5px solid #e2e8f0;
      white-space: nowrap;
    }

    .theme-chip-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
    }

    .theme-chip-btn:hover {
      background: #ffffff;
      color: #2563eb;
      border-color: #93c5fd;
      transform: translateY(-1px);
    }

    .theme-chip-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .theme-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .apply-selected-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      padding: 6px 15px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      margin-left: 6px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .apply-selected-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.45);
    }

    /* Ambient Outer Halo Layers */
    .ambient-halo {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      filter: blur(95px);
    }
    .ambient-halo-1 {
      top: -10vw;
      left: -10vw;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.20) 0%, transparent 70%);
      animation: floatAura1 14s ease-in-out infinite alternate;
    }
    .ambient-halo-2 {
      top: -6vw;
      right: 4vw;
      width: 46vw;
      height: 46vw;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.18) 0%, transparent 70%);
      animation: floatAura2 16s ease-in-out infinite alternate;
    }
    .ambient-halo-3 {
      bottom: -10vw;
      right: -10vw;
      width: 48vw;
      height: 48vw;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.16) 0%, transparent 70%);
      animation: floatAura3 18s ease-in-out infinite alternate;
    }
    .ambient-halo-4 {
      bottom: -8vw;
      left: 8vw;
      width: 48vw;
      height: 48vw;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, transparent 70%);
      animation: floatAura4 15s ease-in-out infinite alternate;
    }

    @keyframes floatAura1 { 0% { transform: translate(0, 0); } 100% { transform: translate(4vw, 3vh); } }
    @keyframes floatAura2 { 0% { transform: translate(0, 0); } 100% { transform: translate(-3vw, 4vh); } }
    @keyframes floatAura3 { 0% { transform: translate(0, 0); } 100% { transform: translate(-4vw, -3vh); } }
    @keyframes floatAura4 { 0% { transform: translate(0, 0); } 100% { transform: translate(3vw, -4vh); } }

    /* Canvas */
    .theme-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      pointer-events: none;
      z-index: 1;
    }

    /* Active Theme Info Floating Card */
    .theme-info-pill {
      position: fixed;
      bottom: 20px;
      right: 24px;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 10px 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 340px;
      pointer-events: none;
    }
    .theme-info-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-info-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: #eff6ff;
      color: #2563eb;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .theme-info-desc {
      font-size: 0.74rem;
      color: #64748b;
      line-height: 1.35;
    }

    /* Main Viewport Stage */
    .viewport-stage {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px;
      padding: clamp(0.75rem, 2vh, 1.8rem) clamp(1rem, 2.5vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      margin-top: 30px;
    }

    /* Master Card Glow Frame with Running Multi-Vibrant Gradient Border */
    .master-card-glow-frame {
      width: 100%;
      position: relative;
      border-radius: 28px;
      padding: 2.5px;
      background: linear-gradient(135deg, #10b981, #f59e0b, #ef4444, #ec4899, #8b5cf6, #2563eb, #06b6d4, #10b981);
      background-size: 300% 300%;
      box-shadow: 
        0 20px 50px -12px rgba(37, 99, 235, 0.16),
        0 10px 25px -8px rgba(236, 72, 153, 0.10),
        0 0 30px rgba(59, 130, 246, 0.12),
        0 0 30px rgba(245, 158, 11, 0.10);
      animation: spectrumGradientFlow 7s ease infinite;
    }

    @keyframes spectrumGradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Master Card Container */
    .master-card-container {
      width: 100%;
      background: #ffffff;
      border-radius: 26px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      align-items: center;
      overflow: hidden;
      position: relative;
      max-height: calc(100vh - clamp(1.5rem, 4vh, 3.6rem) - 50px);
      max-height: calc(100dvh - clamp(1.5rem, 4vh, 3.6rem) - 50px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95);
    }

    /* Left Brand Column */
    .left-brand-column {
      padding: clamp(0.5rem, 1.2vw, 1.2rem);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      overflow: hidden;
      border-top-left-radius: 29px;
      border-bottom-left-radius: 29px;
      height: 100%;
    }

    .left-brand-image-artwork {
      width: 100%;
      height: 100%;
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      border-radius: 22px;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: high-quality;
      /* Ultra-thin multi-vibrant blue gradient border */
      border: 1.2px solid transparent;
      background-clip: padding-box, border-box;
      background-origin: padding-box, border-box;
      background-image: 
        linear-gradient(to bottom, #ffffff, #ffffff), 
        linear-gradient(135deg, #00f2fe 0%, #00c6ff 18%, #2563eb 42%, #3b82f6 65%, #6366f1 85%, #0284c7 100%);
      box-shadow: 
        0 12px 35px -8px rgba(37, 99, 235, 0.14),
        0 0 15px rgba(0, 198, 255, 0.12);
    }

    /* Right Auth Column */
    .right-auth-column {
      padding: clamp(1rem, 2.5vh, 2.5rem) clamp(1rem, 2vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      height: 100%;
    }

    .elevated-auth-subcard {
      width: 100%;
      max-width: 440px;
      min-height: min(560px, 92%);
      background: #ffffff;
      border-radius: 28px;
      position: relative;
      padding: clamp(1.8rem, 3.8vh, 3rem) clamp(1.6rem, 2.2vw, 2.4rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 24px 50px -12px rgba(0, 112, 243, 0.16),
        0 10px 24px -6px rgba(236, 72, 153, 0.12),
        0 0 25px rgba(139, 92, 246, 0.10);
      border: 2px solid transparent;
      background-clip: padding-box, border-box;
      background-origin: padding-box, border-box;
      background-image: 
        linear-gradient(to bottom, #ffffff, #ffffff), 
        linear-gradient(135deg, #00d2ff 0%, #3b82f6 20%, #8b5cf6 40%, #ec4899 60%, #f43f5e 80%, #f59e0b 90%, #10b981 100%);
      background-size: 100% 100%, 300% 300%;
      animation: innerBorderFlow 8s ease infinite;
    }

    @keyframes innerBorderFlow {
      0% { background-position: 0% 0%, 0% 50%; }
      50% { background-position: 0% 0%, 100% 50%; }
      100% { background-position: 0% 0%, 0% 50%; }
    }

    .shield-icon-container {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.4rem;
    }
    .shield-icon-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .eyebrow-secure-access {
      font-family: var(--font-heading);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      background: linear-gradient(90deg, #0284c7 0%, #2563eb 25%, #7c3aed 50%, #db2777 75%, #f59e0b 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
      animation: textShineFlow 5s linear infinite;
    }

    @keyframes textShineFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .secure-access-multicolor-line {
      width: 64px;
      height: 3.5px;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #f59e0b, #ef4444, #ec4899, #8b5cf6, #2563eb, #06b6d4, #10b981);
      background-size: 250% 100%;
      margin: 0.2rem auto clamp(0.6rem, 1.2vh, 0.9rem) auto;
      animation: lineGradientFlow 4s linear infinite;
    }

    @keyframes lineGradientFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }

    .heading-sign-in {
      font-family: var(--font-heading);
      font-size: clamp(1.8rem, 3vh, 2.3rem);
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    .sub-access-desc {
      font-size: clamp(0.82rem, 1.2vh, 0.92rem);
      color: #64748b;
      margin-bottom: clamp(1rem, 2vh, 1.5rem);
      text-align: center;
      font-weight: 500;
    }

    .dummy-input-box {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      padding: 0 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      color: #94a3b8;
      font-size: 0.88rem;
    }

    .dummy-btn {
      width: 100%;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
    }

    @media (max-width: 980px) {
      .master-card-container { grid-template-columns: 1fr; max-height: 90vh; }
      .left-brand-column { display: none; }
      .theme-header-bar { top: 8px; padding: 4px 6px; }
    }
  </style>
</head>
<body>

  <!-- THEME SELECTOR TOP DOCK -->
  <header class="theme-header-bar" role="navigation" aria-label="Theme Selection">
    <div class="theme-dock-brand">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
      </svg>
      Select Theme
    </div>
    
    <button class="theme-chip-btn active" data-theme="laser-spectrum-waves">
      <span class="theme-dot" style="color:#2563eb;"></span>
      1. Moving Spectrum Waves
    </button>
    <button class="theme-chip-btn" data-theme="enterprise-mesh">
      <span class="theme-dot" style="color:#0ea5e9;"></span>
      2. Enterprise Sensor Mesh
    </button>
    <button class="theme-chip-btn" data-theme="quantum-lattice">
      <span class="theme-dot" style="color:#8b5cf6;"></span>
      3. Quantum Lab Lattice
    </button>
    <button class="theme-chip-btn" data-theme="orbital-telemetry">
      <span class="theme-dot" style="color:#ec4899;"></span>
      4. Orbital Security Rings
    </button>
    <button class="theme-chip-btn" data-theme="command-grid-hud">
      <span class="theme-dot" style="color:#10b981;"></span>
      5. SOC Command Grid HUD
    </button>
    <button class="theme-chip-btn" data-theme="hex-cyber-shield">
      <span class="theme-dot" style="color:#f59e0b;"></span>
      6. Hex Barrier Matrix
    </button>
    <button class="theme-chip-btn" data-theme="aurora-prism">
      <span class="theme-dot" style="color:#6366f1;"></span>
      7. Luminous Prism Aurora
    </button>
    <button class="theme-chip-btn" data-theme="particle-stream">
      <span class="theme-dot" style="color:#06b6d4;"></span>
      8. Quantum Particle Stream
    </button>

    <a href="login.html" class="apply-selected-btn" id="applyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      Set on Login
    </a>
  </header>

  <!-- Ambient Outer Glowing Halos -->
  <div class="ambient-halo ambient-halo-1" aria-hidden="true"></div>
  <div class="ambient-halo ambient-halo-2" aria-hidden="true"></div>
  <div class="ambient-halo ambient-halo-3" aria-hidden="true"></div>
  <div class="ambient-halo ambient-halo-4" aria-hidden="true"></div>

  <!-- Dynamic Theme Background Canvas -->
  <canvas id="themeCanvas" class="theme-canvas" aria-hidden="true"></canvas>

  <!-- Theme Info Floating Badge -->
  <div class="theme-info-pill" id="themeInfoPill">
    <div class="theme-info-title">
      <span id="themeTitleText">1. Moving Spectrum Waves</span>
      <span class="theme-info-badge" id="themeBadgeText">Recommended</span>
    </div>
    <div class="theme-info-desc" id="themeDescText">
      Continuous multi-vibrant sinusoidal wave streams shifting smoothly through the full logo color spectrum.
    </div>
  </div>

  <!-- Main Viewport Preview -->
  <div class="viewport-stage">
    <div class="master-card-glow-frame">
      <main class="master-card-container">
        
        <!-- Left Brand Artwork -->
        <section class="left-brand-column">
          <img 
            src="assets/sentinel-left-brand.png" 
            alt="SentinelAI-X Distributed Laboratory Security System" 
            class="left-brand-image-artwork"
            onerror="this.onerror=null; this.src='assets/lab-network.png';"
          />
        </section>

        <!-- Right Sign In Preview Card -->
        <section class="right-auth-column">
          <div class="elevated-auth-subcard">
            
            <div class="shield-icon-container">
              <img src="assets/shield-badge-clean.png" alt="SentinelAI-X Shield" onerror="this.onerror=null; this.src='assets/shield-badge-exact.png';" />
            </div>

            <p class="eyebrow-secure-access">S E C U R E &nbsp; A C C E S S</p>
            <div class="secure-access-multicolor-line"></div>

            <h2 class="heading-sign-in">Sign In</h2>
            <p class="sub-access-desc">Access your laboratory security dashboard</p>

            <div class="dummy-input-box">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:12px;">
                <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                <path d="m22 7-10 6L2 7"></path>
              </svg>
              <span>admin@sentinelai.com</span>
            </div>

            <div class="dummy-input-box">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:12px;">
                <rect x="3" y="11" width="18" height="11" rx="2.5"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <span>••••••••••••</span>
            </div>

            <button class="dummy-btn" type="button">
              Sign In to SentinelAI-X
            </button>
          </div>
        </section>

      </main>
    </div>
  </div>

  <script>
    (function initThemeEngine() {
      const canvas = document.getElementById('themeCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height, dpr;
      let animationFrameId;
      let activeTheme = 'laser-spectrum-waves';
      let tick = 0;

      const THEME_DATA = {
        'laser-spectrum-waves': {
          title: '1. Moving Spectrum Waves',
          badge: 'Recommended',
          desc: 'Harmonic 2D sine ribbons flowing horizontally with live multi-color spectrum shifts and glowing ambient particles.'
        },
        'enterprise-mesh': {
          title: '2. Enterprise Sensor Mesh',
          badge: 'High-Tech SOC',
          desc: 'Clean geometric IoT node network with pulsing telemetry links and floating data beacons in logo hues.'
        },
        'quantum-lattice': {
          title: '3. Quantum Lab Lattice',
          badge: 'Scientific',
          desc: 'Molecular bond grid with rotating orbital electron rings and soft multi-colored atomic nuclei.'
        },
        'orbital-telemetry': {
          title: '4. Orbital Security Rings',
          badge: 'Executive',
          desc: 'Concentric precision telemetry tracks with rotating sweep markers, angle coordinates, and satellite pings.'
        },
        'command-grid-hud': {
          title: '5. SOC Command Grid HUD',
          badge: 'Mission Control',
          desc: 'Clean technical blueprint grid with active drone coordinates, latitude/longitude marks, and security radar sweeps.'
        },
        'hex-cyber-shield': {
          title: '6. Hex Barrier Matrix',
          badge: 'Cyber Defense',
          desc: 'Crisp hexagonal defense barrier cells that illuminate sequentially with multi-colored data flow.'
        },
        'aurora-prism': {
          title: '7. Luminous Prism Aurora',
          badge: 'Modern Aesthetic',
          desc: 'Ultra-clean, tranquil refractive light caustics with soft rainbow color dispersion on pure luminous white.'
        },
        'particle-stream': {
          title: '8. Quantum Particle Stream',
          badge: 'Fluid Dynamics',
          desc: 'Streams of micro-luminescent particles flowing gently along curved optical vectors.'
        }
      };

      function resize() {
        dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.scale(dpr, dpr);
        initEntities();
      }

      // -----------------------------------------------------------------------
      // ENTITY INITIALIZATION
      // -----------------------------------------------------------------------
      let nodes = [];
      let molecules = [];
      let orbitalRings = [];
      let particles = [];
      let hexCells = [];
      let radarAngle = 0;

      function initEntities() {
        // 1. Mesh Nodes
        nodes = [];
        const nodeCount = Math.min(55, Math.floor((width * height) / 22000));
        for (let i = 0; i < nodeCount; i++) {
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            radius: Math.random() * 2.8 + 1.5,
            baseHue: Math.random() * 360,
            pulse: Math.random() * Math.PI * 2
          });
        }

        // 2. Molecular Lattice
        molecules = [];
        const molCount = 20;
        for (let i = 0; i < molCount; i++) {
          molecules.push({
            x: Math.random() * width,
            y: Math.random() * height,
            orbitRadius: Math.random() * 24 + 18,
            angle: Math.random() * Math.PI * 2,
            speed: (Math.random() - 0.5) * 0.03,
            vx: (Math.random() - 0.5) * 0.35,
            vy: (Math.random() - 0.5) * 0.35,
            hue: Math.random() * 360
          });
        }

        // 3. Orbital Rings
        orbitalRings = [
          { cx: width * 0.12, cy: height * 0.3, r: 110, speed: 0.012, blips: [0, 2.1, 4.2], hue: 215 },
          { cx: width * 0.88, cy: height * 0.25, r: 130, speed: -0.009, blips: [1.2, 3.8], hue: 330 },
          { cx: width * 0.84, cy: height * 0.78, r: 150, speed: 0.008, blips: [0.5, 2.8, 5.0], hue: 270 },
          { cx: width * 0.15, cy: height * 0.82, r: 120, speed: -0.011, blips: [1.8, 4.5], hue: 45 }
        ];

        // 4. Hex Cells
        hexCells = [];
        const hexR = 38;
        const hexW = Math.sqrt(3) * hexR;
        const hexH = 2 * hexR * 0.75;
        for (let y = -hexR; y < height + hexR * 2; y += hexH) {
          const row = Math.floor(y / hexH);
          for (let x = -hexR; x < width + hexR * 2; x += hexW) {
            const offsetX = (row % 2 === 0) ? 0 : hexW / 2;
            hexCells.push({
              cx: x + offsetX,
              cy: y,
              radius: hexR - 2.5,
              phase: Math.random() * Math.PI * 2,
              hue: Math.random() * 360
            });
          }
        }

        // 5. Particles
        particles = [];
        const partCount = Math.min(65, Math.floor((width * height) / 18000));
        for (let i = 0; i < partCount; i++) {
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 2.6 + 1.2,
            vx: (Math.random() - 0.5) * 0.5,
            vy: -Math.random() * 0.55 - 0.2,
            baseHue: Math.random() * 360,
            alpha: Math.random() * 0.45 + 0.35,
            pulseSpeed: Math.random() * 0.02 + 0.01,
            pulseOffset: Math.random() * Math.PI * 2
          });
        }
      }

      // -----------------------------------------------------------------------
      // MASTER RENDER LOOP
      // -----------------------------------------------------------------------
      function renderTheme() {
        tick++;
        ctx.clearRect(0, 0, width, height);

        switch (activeTheme) {
          case 'laser-spectrum-waves':
            renderLaserSpectrumWaves();
            break;
          case 'enterprise-mesh':
            renderEnterpriseMesh();
            break;
          case 'quantum-lattice':
            renderQuantumLattice();
            break;
          case 'orbital-telemetry':
            renderOrbitalTelemetry();
            break;
          case 'command-grid-hud':
            renderCommandGridHud();
            break;
          case 'hex-cyber-shield':
            renderHexCyberShield();
            break;
          case 'aurora-prism':
            renderAuroraPrism();
            break;
          case 'particle-stream':
            renderParticleStream();
            break;
        }

        animationFrameId = requestAnimationFrame(renderTheme);
      }

      // =======================================================================
      // THEME 1: Moving Spectrum Waves (Dynamic Color-Cycling Sine Waves)
      // =======================================================================
      function renderLaserSpectrumWaves() {
        const waveConfigs = [
          { yRatio: 0.18, amp: 30, freq: 0.0032, speed: 0.014, hueOffset: 0, lineWidth: 2.8, glowBlur: 14 },
          { yRatio: 0.32, amp: 38, freq: 0.0026, speed: 0.010, hueOffset: 60, lineWidth: 2.5, glowBlur: 12 },
          { yRatio: 0.48, amp: 44, freq: 0.0029, speed: 0.012, hueOffset: 120, lineWidth: 2.8, glowBlur: 15 },
          { yRatio: 0.65, amp: 36, freq: 0.0035, speed: 0.015, hueOffset: 180, lineWidth: 2.4, glowBlur: 12 },
          { yRatio: 0.80, amp: 42, freq: 0.0024, speed: 0.009, hueOffset: 240, lineWidth: 2.6, glowBlur: 14 },
          { yRatio: 0.92, amp: 28, freq: 0.0038, speed: 0.016, hueOffset: 300, lineWidth: 2.2, glowBlur: 10 }
        ];

        waveConfigs.forEach((cfg) => {
          const yCenter = height * cfg.yRatio;
          const time = tick * cfg.speed;

          const grad = ctx.createLinearGradient(0, yCenter - cfg.amp, width, yCenter + cfg.amp);
          const baseHue = (tick * 0.65 + cfg.hueOffset) % 360;

          grad.addColorStop(0.00, `hsla(${(baseHue + 0) % 360}, 85%, 52%, 0.85)`);
          grad.addColorStop(0.16, `hsla(${(baseHue + 60) % 360}, 90%, 52%, 0.85)`);
          grad.addColorStop(0.33, `hsla(${(baseHue + 120) % 360}, 85%, 50%, 0.85)`);
          grad.addColorStop(0.50, `hsla(${(baseHue + 180) % 360}, 90%, 54%, 0.85)`);
          grad.addColorStop(0.66, `hsla(${(baseHue + 240) % 360}, 88%, 52%, 0.85)`);
          grad.addColorStop(0.83, `hsla(${(baseHue + 300) % 360}, 90%, 52%, 0.85)`);
          grad.addColorStop(1.00, `hsla(${(baseHue + 360) % 360}, 85%, 52%, 0.85)`);

          ctx.beginPath();
          const step = 14;
          for (let x = 0; x <= width + step; x += step) {
            const wave1 = Math.sin(x * cfg.freq + time) * cfg.amp;
            const wave2 = Math.cos(x * (cfg.freq * 0.65) + time * 0.75) * (cfg.amp * 0.45);
            const wave3 = Math.sin(x * 0.0015 + time * 0.5) * (cfg.amp * 0.25);
            const y = yCenter + wave1 + wave2 + wave3;

            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }

          ctx.strokeStyle = grad;
          ctx.lineWidth = cfg.lineWidth;
          ctx.shadowColor = `hsla(${baseHue}, 90%, 55%, 0.4)`;
          ctx.shadowBlur = cfg.glowBlur;
          ctx.stroke();
          ctx.shadowBlur = 0;
        });

        // Floating ambient particles with color shift
        renderParticles();
      }

      // =======================================================================
      // THEME 2: Enterprise Sensor Mesh (High-Tech Connected Nodes)
      // =======================================================================
      function renderEnterpriseMesh() {
        const maxDist = 135;
        for (let i = 0; i < nodes.length; i++) {
          const n1 = nodes[i];
          n1.x += n1.vx;
          n1.y += n1.vy;
          if (n1.x < 0 || n1.x > width) n1.vx *= -1;
          if (n1.y < 0 || n1.y > height) n1.vy *= -1;

          const hue1 = (n1.baseHue + tick * 0.4) % 360;

          for (let j = i + 1; j < nodes.length; j++) {
            const n2 = nodes[j];
            const dx = n1.x - n2.x;
            const dy = n1.y - n2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < maxDist) {
              const alpha = (1 - dist / maxDist) * 0.4;
              ctx.beginPath();
              ctx.moveTo(n1.x, n1.y);
              ctx.lineTo(n2.x, n2.y);
              ctx.strokeStyle = `hsla(${hue1}, 80%, 50%, ${alpha.toFixed(2)})`;
              ctx.lineWidth = 1.1;
              ctx.stroke();
            }
          }

          // Node Beacon
          ctx.beginPath();
          ctx.fillStyle = `hsla(${hue1}, 85%, 52%, 0.9)`;
          ctx.shadowColor = `hsla(${hue1}, 90%, 55%, 0.5)`;
          ctx.shadowBlur = 8;
          ctx.arc(n1.x, n1.y, n1.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }

      // =======================================================================
      // THEME 3: Quantum Lab Lattice (Molecular Electron Rings)
      // =======================================================================
      function renderQuantumLattice() {
        molecules.forEach((m, idx) => {
          m.x += m.vx;
          m.y += m.vy;
          if (m.x < 50 || m.x > width - 50) m.vx *= -1;
          if (m.y < 50 || m.y > height - 50) m.vy *= -1;

          m.angle += m.speed;
          const currentHue = (m.hue + tick * 0.5) % 360;

          // Central Nucleus
          ctx.beginPath();
          ctx.fillStyle = `hsla(${currentHue}, 85%, 52%, 0.8)`;
          ctx.shadowColor = `hsla(${currentHue}, 90%, 55%, 0.5)`;
          ctx.shadowBlur = 10;
          ctx.arc(m.x, m.y, 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;

          // Orbit Track
          ctx.beginPath();
          ctx.arc(m.x, m.y, m.orbitRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${currentHue}, 80%, 50%, 0.2)`;
          ctx.lineWidth = 1;
          ctx.stroke();

          // Orbiting Electron
          const ex = m.x + Math.cos(m.angle) * m.orbitRadius;
          const ey = m.y + Math.sin(m.angle) * m.orbitRadius;
          ctx.beginPath();
          ctx.fillStyle = `hsla(${(currentHue + 60) % 360}, 90%, 55%, 0.9)`;
          ctx.arc(ex, ey, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // =======================================================================
      // THEME 4: Orbital Security Rings (Precision Telemetry Tracks)
      // =======================================================================
      function renderOrbitalTelemetry() {
        orbitalRings.forEach((ring) => {
          const baseHue = (ring.hue + tick * 0.3) % 360;

          // Ring 1 (Solid Track)
          ctx.beginPath();
          ctx.arc(ring.cx, ring.cy, ring.r, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${baseHue}, 80%, 50%, 0.25)`;
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Ring 2 (Dashed Outer Track)
          ctx.beginPath();
          ctx.setLineDash([4, 6]);
          ctx.arc(ring.cx, ring.cy, ring.r + 20, 0, Math.PI * 2);
          ctx.strokeStyle = `hsla(${baseHue}, 80%, 50%, 0.18)`;
          ctx.stroke();
          ctx.setLineDash([]);

          // Satellite Radar Markers
          ring.blips.forEach((blipAngle, bIdx) => {
            const curAngle = blipAngle + tick * ring.speed;
            const px = ring.cx + Math.cos(curAngle) * ring.r;
            const py = ring.cy + Math.sin(curAngle) * ring.r;

            ctx.beginPath();
            ctx.fillStyle = `hsla(${(baseHue + bIdx * 45) % 360}, 90%, 52%, 0.9)`;
            ctx.shadowColor = `hsla(${baseHue}, 90%, 55%, 0.6)`;
            ctx.shadowBlur = 8;
            ctx.arc(px, py, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
          });
        });
      }

      // =======================================================================
      // THEME 5: SOC Command Grid HUD (Technical Blueprint & Radar Sweep)
      // =======================================================================
      function renderCommandGridHud() {
        const gridSize = 45;
        ctx.strokeStyle = 'rgba(59, 130, 246, 0.08)';
        ctx.lineWidth = 1;

        for (let x = 0; x <= width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y <= height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }

        // Radar Sweep from Center
        const cx = width * 0.5;
        const cy = height * 0.5;
        radarAngle += 0.015;

        for (let r = 100; r <= 500; r += 100) {
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(37, 99, 235, 0.12)';
          ctx.stroke();
        }

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(radarAngle);
        const sweepGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 500);
        sweepGrad.addColorStop(0, 'rgba(59, 130, 246, 0.22)');
        sweepGrad.addColorStop(0.8, 'rgba(6, 182, 212, 0.04)');
        sweepGrad.addColorStop(1, 'transparent');

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 500, 0, Math.PI / 4);
        ctx.closePath();
        ctx.fillStyle = sweepGrad;
        ctx.fill();
        ctx.restore();

        // Technical Coordinates
        ctx.font = '500 11px JetBrains Mono, monospace';
        ctx.fillStyle = '#64748b';
        ctx.fillText(`SYS.ZONE: LAB-NORTH // [${Math.floor(tick * 0.1) % 999}]`, 30, height - 30);
        ctx.fillText('STATUS: AI-SHIELD ONLINE', width - 210, height - 30);
      }

      // =======================================================================
      // THEME 6: Hex Barrier Matrix (Honeycomb Defense Lattice)
      // =======================================================================
      function renderHexCyberShield() {
        hexCells.forEach((hex) => {
          const pulseVal = Math.sin(tick * 0.025 + hex.phase);
          const alpha = 0.06 + Math.max(0, pulseVal) * 0.35;
          const hue = (hex.hue + tick * 0.4) % 360;

          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (Math.PI / 3) * i;
            const hx = hex.cx + hex.radius * Math.cos(angle);
            const hy = hex.cy + hex.radius * Math.sin(angle);
            if (i === 0) ctx.moveTo(hx, hy);
            else ctx.lineTo(hx, hy);
          }
          ctx.closePath();

          ctx.strokeStyle = `hsla(${hue}, 80%, 52%, ${alpha.toFixed(2)})`;
          ctx.lineWidth = 1.3;
          if (pulseVal > 0.8) {
            ctx.fillStyle = `hsla(${hue}, 85%, 55%, 0.08)`;
            ctx.fill();
          }
          ctx.stroke();
        });
      }

      // =======================================================================
      // THEME 7: Luminous Prism Aurora (Apple / Stripe Refractive Glow)
      // =======================================================================
      function renderAuroraPrism() {
        const blobCount = 4;
        for (let b = 0; b < blobCount; b++) {
          const hue = (tick * 0.3 + b * 90) % 360;
          const cx = width * (0.2 + b * 0.2) + Math.sin(tick * 0.01 + b) * 60;
          const cy = height * (0.3 + (b % 2) * 0.35) + Math.cos(tick * 0.01 + b) * 50;
          const r = Math.min(width, height) * 0.28;

          const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
          grad.addColorStop(0, `hsla(${hue}, 85%, 60%, 0.18)`);
          grad.addColorStop(0.5, `hsla(${(hue + 45) % 360}, 80%, 55%, 0.06)`);
          grad.addColorStop(1, 'transparent');

          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        }
      }

      // =======================================================================
      // THEME 8: Quantum Particle Stream (Optical Wave Data Streams)
      // =======================================================================
      function renderParticleStream() {
        const streamCount = 5;
        for (let s = 0; s < streamCount; s++) {
          const hue = (tick * 0.5 + s * 70) % 360;
          const startY = height * (0.2 + s * 0.15);

          ctx.beginPath();
          ctx.moveTo(0, startY);
          const cp1x = width * 0.35;
          const cp1y = startY + Math.sin(tick * 0.018 + s) * 70;
          const cp2x = width * 0.65;
          const cp2y = startY - Math.cos(tick * 0.018 + s) * 70;
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, width, startY + (s % 2 === 0 ? 40 : -40));

          ctx.strokeStyle = `hsla(${hue}, 85%, 52%, 0.65)`;
          ctx.lineWidth = 2.2;
          ctx.shadowColor = `hsla(${hue}, 90%, 55%, 0.4)`;
          ctx.shadowBlur = 10;
          ctx.stroke();
          ctx.shadowBlur = 0;
        }

        renderParticles();
      }

      function renderParticles() {
        particles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -10) p.x = width + 10;
          if (p.x > width + 10) p.x = -10;
          if (p.y < -10) p.y = height + 10;
          if (p.y > height + 10) p.y = -10;

          const currentHue = (p.baseHue + tick * 0.6) % 360;
          const currentAlpha = p.alpha + Math.sin(tick * p.pulseSpeed + p.pulseOffset) * 0.18;
          const clampedAlpha = Math.max(0.18, Math.min(0.9, currentAlpha));

          ctx.beginPath();
          ctx.fillStyle = `hsla(${currentHue}, 85%, 54%, ${clampedAlpha.toFixed(2)})`;
          ctx.shadowColor = `hsla(${currentHue}, 90%, 55%, 0.55)`;
          ctx.shadowBlur = 8;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      // -----------------------------------------------------------------------
      // THEME BUTTONS INTERACTION
      // -----------------------------------------------------------------------
      const themeButtons = document.querySelectorAll('.theme-chip-btn');
      const themeTitleEl = document.getElementById('themeTitleText');
      const themeBadgeEl = document.getElementById('themeBadgeText');
      const themeDescEl = document.getElementById('themeDescText');
      const applyBtn = document.getElementById('applyBtn');

      themeButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          themeButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          activeTheme = btn.getAttribute('data-theme');

          const info = THEME_DATA[activeTheme];
          if (info) {
            themeTitleEl.textContent = info.title;
            themeBadgeEl.textContent = info.badge;
            themeDescEl.textContent = info.desc;
          }

          if (applyBtn) {
            applyBtn.href = `login.html?theme=${activeTheme}`;
          }

          localStorage.setItem('sentinel_active_theme', activeTheme);
          initEntities();
        });
      });

      window.addEventListener('resize', resize);
      resize();
      renderTheme();
    })();
  </script>
</body>
