[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# Password Reset Links & Function Rewrites
[[redirects]]
  from = "/reset-password"
  to = "/reset-password.html"
  status = 200

[[redirects]]
  from = "/api/auth/request-password-reset"
  to = "/.netlify/functions/request-password-reset"
  status = 200

[[redirects]]
  from = "/api/request-password-reset"
  to = "/.netlify/functions/request-password-reset"
  status = 200

[[redirects]]
  from = "/api/auth/verify-reset-token"
  to = "/.netlify/functions/verify-reset-token"
  status = 200

[[redirects]]
  from = "/api/verify-reset-token"
  to = "/.netlify/functions/verify-reset-token"
  status = 200

# API Route Rewrites to Netlify Functions
[[redirects]]
  from = "/api/auth/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/send-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/auth/resend-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/resend-otp"
  to = "/.netlify/functions/send-otp"
  status = 200

[[redirects]]
  from = "/api/auth/verify-otp"
  to = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/verify-otp"
  to = "/.netlify/functions/verify-otp"
  status = 200

[[redirects]]
  from = "/api/auth/reset-password"
  to = "/.netlify/functions/reset-password"
  status = 200

[[redirects]]
  from = "/api/reset-password"
  to = "/.netlify/functions/reset-password"
  status = 200

# Direct root to login portal as primary entry
[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = false
